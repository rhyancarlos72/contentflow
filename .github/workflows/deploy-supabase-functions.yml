# Publica as Edge Functions (IA, pagamentos, conta, e-mails) no Supabase sempre
# que algo em supabase/functions mudar na main — ou manualmente em Actions.
# Requer o secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Publicar funções no Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'slnrnndioeiaibyyazzh' }}
    steps:
      - uses: actions/checkout@v5

      - name: Verificar token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Crie o secret SUPABASE_ACCESS_TOKEN em Settings → Secrets and variables → Actions (token em Supabase → Account → Access Tokens)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar funções
        # Uma por vez; em caso de erro, o final do log vira anotação no resumo da execução.
        run: |
          failed=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "::group::$name"
            if supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api > "/tmp/$name.log" 2>&1; then
              cat "/tmp/$name.log"
            else
              cat "/tmp/$name.log"
              msg=$(tail -n 25 "/tmp/$name.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Falha ao publicar $name::$msg"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
