# Gera o build de produção a cada push na main e publica a pasta dist/
# no branch "hostinger". Na Hostinger (hPanel → Avançado → Git), aponte
# o repositório para esse branch e ative a implantação automática.
name: Build para Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Usa os secrets quando existirem; senão vale o .env.production do repositório.
        run: |
          if [ -n "$SB_URL" ]; then export VITE_SUPABASE_URL="$SB_URL"; fi
          if [ -n "$SB_ANON_KEY" ]; then export VITE_SUPABASE_ANON_KEY="$SB_ANON_KEY"; fi
          if [ -n "$GOOGLE_AUTH" ]; then export VITE_GOOGLE_AUTH_ENABLED="$GOOGLE_AUTH"; fi
          npm run build
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GOOGLE_AUTH: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

      - name: Publicar dist/ no branch hostinger
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger
