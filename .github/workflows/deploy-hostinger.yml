# A cada push na main:
# 1. Gera o build de produção.
# 2. Se a pasta dist/ mudou, envia a versão atualizada para a própria main
#    (a Hostinger Node.js não roda build: o server.js usa a dist/ do repositório).
# 3. Publica a dist/ no branch "hostinger" (hospedagem comum via hPanel → Git).
# Pushes feitos com o GITHUB_TOKEN não disparam este workflow de novo.
name: Build para Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Usa os secrets quando existirem; senão vale o .env.production do repositório.
        run: |
          if [ -n "$SB_URL" ]; then export VITE_SUPABASE_URL="$SB_URL"; fi
          if [ -n "$SB_ANON_KEY" ]; then export VITE_SUPABASE_ANON_KEY="$SB_ANON_KEY"; fi
          if [ -n "$GOOGLE_AUTH" ]; then export VITE_GOOGLE_AUTH_ENABLED="$GOOGLE_AUTH"; fi
          npm run build
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GOOGLE_AUTH: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

      - name: Atualizar dist/ na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist/ já está atualizada."
          else
            git commit -q -m "Atualiza build (dist/) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publicar dist/ no branch hostinger
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hostinger
